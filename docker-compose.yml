services:
  postgres:
    image: postgres:16
    container_name: aegismesh-postgres

    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: aegismesh
      POSTGRES_PASSWORD: aegismesh

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: