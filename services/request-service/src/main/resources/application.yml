server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/request_db
    username: aegismesh
    password: aegismesh
    driver-class-name: org.postgresql.Driver

  kafka:
     bootstrap-servers: localhost:9092

     producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

     consumer:
      group-id: request-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        # Ignore the producer's class name header and read every message as our own event record
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.aegismesh.request.event.StockReservationResultEvent
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

management:
  endpoints:
    web:
      exposure:
        include: health,info
