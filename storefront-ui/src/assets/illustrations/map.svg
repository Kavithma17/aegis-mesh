<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" fill="none">
  <!-- land -->
  <rect width="520" height="400" rx="28" fill="#F1F6FE"/>

  <!-- water -->
  <path d="M0 300c60-20 120 10 180-6s110-40 170-20 120 30 170 10v88c0 15-13 28-28 28H28c-15 0-28-13-28-28z" fill="#DBEAFE"/>
  <path d="M40 336c24-8 48 0 72-6M300 350c24-8 48 0 72-6" stroke="#BFDBFE" stroke-width="4" stroke-linecap="round"/>

  <!-- parks -->
  <ellipse cx="96" cy="96" rx="56" ry="38" fill="#DCFCE7"/>
  <ellipse cx="420" cy="210" rx="52" ry="34" fill="#DCFCE7"/>
  <circle cx="84" cy="90" r="9" fill="#86EFAC"/>
  <circle cx="108" cy="104" r="7" fill="#86EFAC"/>
  <circle cx="412" cy="204" r="8" fill="#86EFAC"/>

  <!-- roads -->
  <g stroke="#FFFFFF" stroke-width="16" stroke-linecap="round">
    <path d="M-10 180C120 170 200 210 290 190S440 120 530 140"/>
    <path d="M200 -10c-10 90 20 170 0 300"/>
    <path d="M350 -10c20 80-10 150 30 230"/>
  </g>
  <g stroke="#E3EAF5" stroke-width="3" stroke-dasharray="10 10" stroke-linecap="round">
    <path d="M-10 180C120 170 200 210 290 190S440 120 530 140"/>
    <path d="M200 -10c-10 90 20 170 0 300"/>
  </g>
  <g stroke="#FFFFFF" stroke-width="8" stroke-linecap="round">
    <path d="M40 250c60 0 100-20 160-24"/>
    <path d="M290 60c40 10 90 0 140 20"/>
  </g>

  <!-- you are here -->
  <circle cx="250" cy="200" r="34" fill="#3B82F6" opacity=".15"/>
  <circle cx="250" cy="200" r="20" fill="#3B82F6" opacity=".25"/>
  <circle cx="250" cy="200" r="9" fill="#2563EB" stroke="#FFFFFF" stroke-width="4"/>

  <!-- pharmacy pins: in stock -->
  <g>
    <path d="M150 128c0-17 13-30 30-30s30 13 30 30c0 22-30 48-30 48s-30-26-30-48z" fill="#2563EB"/>
    <circle cx="180" cy="128" r="14" fill="#FFFFFF"/>
    <path d="M176 120h8v4h4v8h-4v4h-8v-4h-4v-8h4z" fill="#16A34A"/>
    <rect x="200" y="86" width="58" height="26" rx="13" fill="#FFFFFF" stroke="#DBEAFE" stroke-width="2"/>
    <circle cx="214" cy="99" r="5" fill="#16A34A"/>
    <text x="236" y="104" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#0B2A5B">12</text>
  </g>

  <g>
    <path d="M330 92c0-15 12-26 26-26s26 11 26 26c0 19-26 42-26 42s-26-23-26-42z" fill="#2563EB"/>
    <circle cx="356" cy="92" r="12" fill="#FFFFFF"/>
    <path d="M353 85h6v4h4v6h-4v4h-6v-4h-4v-6h4z" fill="#16A34A"/>
    <rect x="378" y="52" width="52" height="24" rx="12" fill="#FFFFFF" stroke="#DBEAFE" stroke-width="2"/>
    <circle cx="391" cy="64" r="5" fill="#16A34A"/>
    <text x="411" y="69" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#0B2A5B">7</text>
  </g>

  <!-- low stock -->
  <g>
    <path d="M300 236c0-15 12-26 26-26s26 11 26 26c0 19-26 42-26 42s-26-23-26-42z" fill="#2563EB"/>
    <circle cx="326" cy="236" r="12" fill="#FFFFFF"/>
    <path d="M323 229h6v4h4v6h-4v4h-6v-4h-4v-6h4z" fill="#16A34A"/>
    <rect x="348" y="250" width="52" height="24" rx="12" fill="#FFFFFF" stroke="#FDE68A" stroke-width="2"/>
    <circle cx="361" cy="262" r="5" fill="#F59E0B"/>
    <text x="381" y="267" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#0B2A5B">2</text>
